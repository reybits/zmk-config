# Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_KEYBOARD_NAME="Rolio46.2"

# Set deep sleep to 30 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_EXT_POWER=y

# Enable soft off
CONFIG_ZMK_PM_SOFT_OFF=y

# Lower the "press" debounce and keep the default value for the release.
# Default value for both options is 5
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# Improves compatibility with iPad
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y

# Boost Bluetooth TX power to make Bluetooth stronger.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable split battery reporting
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Experimental BLE features. Heads-up: in ZMK's Kconfig this hard-selects
# EXPERIMENTAL_CONN and EXPERIMENTAL_SEC, so CONN is always on while this
# is y - commenting out a separate CONN line is a no-op.
#
# Kept at n as a standing freeze mitigation. A one-week A/B (2026-07)
# confirmed the central-half hang rate tracks EXPERIMENTAL_CONN: with
# it on, several hangs per day across two widget eras; with it off,
# about one per week, reproduced over two on/off cycles. Battery
# drain on the central also improved markedly with it off (2M PHY
# stays enabled, default connection parameters). The underlying
# upstream main/Zephyr 4.1 freeze regression is still open; revisit
# when upstream lands a fix. Side effect of n: EXPERIMENTAL_SEC is
# off too, so re-pairing a host that lost its bond may need the
# keyboard-side bond cleared first.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Setup the Backlight
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=5
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_USB=y
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_BRT_STEP=5

# Use the Vista508 widgets rather than the built ins
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n

# Invert widget colors (black background, white foreground; bitmap
# images get their indexed palette flipped to match)
CONFIG_VISTA508_WIDGET_INVERTED=n

# Replace the WPM graph on the central display with something more
# useful for a homerow-mod user: a static procedural landscape plus
# a live indicator of which HID modifiers are held. Frees the top
# canvas from the constant WPM redraws too.
CONFIG_VISTA508_WIDGET_TOP_MODS_ART=y

# LVGL 9's layer/draw call chain on the three 144x144 canvases needs
# more stack than the dedicated display thread's 2 KiB default. 8 KiB
# was only validated (under MPU stack protection) for the WPM-era
# draw path; MODS_ART has not been, so it keeps the proven 16 KiB
# (~3% of SRAM) until validated at less.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=16384

CONFIG_ZMK_POINTING=y
